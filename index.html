<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정 탈퇴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 바탕화면 아이콘 -->
<div class="desktop-icons">
  <div class="desktop-icon">
    <span>🖥️</span>
    <span>내 컴퓨터</span>
  </div>
  <div class="desktop-icon">
    <span>🗑️</span>
    <span>휴지통</span>
  </div>
  <div class="desktop-icon">
    <span>📁</span>
    <span>내 문서</span>
  </div>
</div>

<!-- 작업표시줄 -->
<div class="taskbar">
  <button class="taskbar-start">🪟 시작</button>
  <div class="taskbar-item">계정 관리</div>
  <div class="taskbar-clock" id="taskbar-clock">00:00</div>
</div>

<div id="app">

  <!-- 진입 화면 -->
  <div id="screen-intro" class="screen active">
    <div class="window">
      <div class="window-titlebar">
        <span class="titlebar-icon">⚠️</span>
        <span class="titlebar-title">계정 관리</span>
        <div class="window-titlebar-buttons">
          <button class="titlebar-btn">_</button>
          <button class="titlebar-btn">□</button>
          <button class="titlebar-btn">✕</button>
        </div>
      </div>
      <hr class="window-divider">
      <div class="window-content">
        <div class="window-icon">⚠️</div>
        <p>계정을 탈퇴하시겠습니까?</p>
        <div class="buttons">
          <button onclick="startFlow()">예</button>
          <button onclick="exit()">아니오</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 반복 확인 화면 -->
  <div id="screen-confirm" class="screen">
    <div class="window" id="confirm-popup">
      <div class="window-titlebar">
        <span class="titlebar-icon">❓</span>
        <span class="titlebar-title">확인 필요</span>
        <div class="window-titlebar-buttons">
          <button class="titlebar-btn">_</button>
          <button class="titlebar-btn">□</button>
          <button class="titlebar-btn">✕</button>
        </div>
      </div>
      <hr class="window-divider">
      <div class="window-content">
        <div class="window-icon">❓</div>
        <p id="confirm-text">정말 탈퇴하시겠습니까?</p>
        <div class="buttons" id="buttons">
          <button id="yes-btn" onclick="nextConfirm()">예</button>
          <button id="no-btn" onclick="exit()">아니오</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 로딩 화면 -->
  <div id="screen-loading" class="screen">
    <div class="window">
      <div class="window-titlebar">
        <span class="titlebar-icon">⏳</span>
        <span class="titlebar-title">계정 삭제 중...</span>
        <div class="window-titlebar-buttons">
          <button class="titlebar-btn">_</button>
          <button class="titlebar-btn">□</button>
          <button class="titlebar-btn">✕</button>
        </div>
      </div>
      <hr class="window-divider">
      <div class="window-content">
        <div class="window-icon">⏳</div>
        <p id="loading-text">계정을 삭제하는 중입니다...</p>
        <div class="loading-bar-wrap">
          <div class="loading-bar" id="loading-bar"></div>
        </div>
        <p id="loading-percent">0%</p>
      </div>
    </div>
  </div>

  <!-- 완료 화면 -->
  <div id="screen-done" class="screen">
    <div class="window">
      <div class="window-titlebar">
        <span class="titlebar-icon">✅</span>
        <span class="titlebar-title">완료</span>
        <div class="window-titlebar-buttons">
          <button class="titlebar-btn">_</button>
          <button class="titlebar-btn">□</button>
          <button class="titlebar-btn">✕</button>
        </div>
      </div>
      <hr class="window-divider">
      <div class="window-content">
        <div class="window-icon">✅</div>
        <p>탈퇴가 완료되었습니다</p>
      </div>
    </div>
  </div>

  <!-- 엔딩 화면 -->
  <div id="screen-ending" class="screen">
    <div class="ending-text">
      <span id="ending-time"></span>
      <span id="ending-question">탈퇴하는 데 이만큼의 시간이 필요했나요?</span>
      <button onclick="restart()">처음으로</button>
    </div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
