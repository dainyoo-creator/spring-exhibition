<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정 탈퇴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- 진입 화면 -->
    <div id="screen-intro" class="screen active">
      <div class="popup">
        <p>계정을 탈퇴하시겠습니까?</p>
        <div class="buttons">
          <button onclick="startFlow()">예</button>
          <button onclick="exit()">아니오</button>
        </div>
      </div>
    </div>

    <!-- 반복 확인 화면 -->
    <div id="screen-confirm" class="screen">
      <div class="popup" id="confirm-popup">
        <p id="confirm-text">정말 탈퇴하시겠습니까?</p>
        <div class="buttons">
          <button id="yes-btn" onclick="nextConfirm()">예</button>
          <button id="no-btn" onclick="exit()">아니오</button>
        </div>
      </div>
    </div>

    <!-- 로딩 화면 -->
    <div id="screen-loading" class="screen">
      <div class="popup" id="loading-popup">
        <p id="loading-text">계정을 삭제하는 중입니다...</p>
        <div class="loading-bar-wrap">
          <div class="loading-bar" id="loading-bar"></div>
        </div>
        <p id="loading-percent">0%</p>
      </div>
    </div>

    <!-- 완료 화면 -->
    <div id="screen-done" class="screen">
      <div class="popup">
        <p>탈퇴가 완료되었습니다</p>
      </div>
    </div>

    <!-- 엔딩 화면 -->
<div id="screen-ending" class="screen">
  <div class="ending-text">
    <p id="ending-time"></p>
    <p>탈퇴하는 데 이만큼의 시간이 필요했나요?</p>
    <button onclick="restart()" style="margin-top: 40px; background-color: #fff; color: #000;">처음으로</button>
  </div>
</div>

  </div>
  <script src="script.js"></script>
</body>
</html>
